name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    uses: ch55secake/cheesecake-factory/.github/workflows/release.yml@main
    with:
      binary-name: apollo
      build-package: ./cmd/apollo
      cgo-enabled: '0'
      targets: '[{"goos":"linux","goarch":"amd64"},{"goos":"linux","goarch":"arm64"},{"goos":"darwin","goarch":"amd64"},{"goos":"darwin","goarch":"arm64"}]'
      version: 0.1.1
      ldflags: "-s -w -X main.version=0.1.1"
